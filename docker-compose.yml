# Sistema Marmitex B2B — uso local em 1–2 notebooks (ARCHITECTURE.md D-11).
# Instalação: veja INSTALL.md.   Uso: cp .env.example .env  (preencher)  &&  docker compose up -d --build
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: America/Sao_Paulo
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *logging

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    logging: *logging

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      # Acesso pelos notebooks da rede local: http://<ip-do-notebook-servidor>:8080
      - "8080:8080"
    logging: *logging

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGHOST: db
      BACKUP_HOUR: ${BACKUP_HOUR:-23}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      TZ: America/Sao_Paulo
    volumes:
      - ./backups:/backups
      - ./ops:/ops:ro
    entrypoint: ["/bin/sh", "/ops/backup-loop.sh"]
    depends_on:
      db:
        condition: service_healthy
    logging: *logging

volumes:
  postgres-data:
